<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Sales Agent | Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container-wide navbar">
      <a class="brand" href="index.html"><span class="brand-mark"><img src="assets/logo-icon.png" alt="AI Sales Agent logo" /></span><span class="brand-copy"><span class="brand-title">AI Sales Agent</span><span class="brand-tagline"></span></span></a>
      <nav class="nav-links" data-nav-links aria-label="Main navigation"><a href="index.html">Home</a><a href="assistant.html">Voice Assistant</a><a href="products.html">Products</a><a href="dashboard.html">Dashboard</a></nav>
      <div class="nav-actions" data-nav-actions><a class="btn btn-ghost active" href="login.html">Login</a><a class="btn btn-primary" href="signup.html">Sign Up</a></div>
      <button class="nav-toggle" type="button" data-nav-toggle aria-label="Toggle menu" aria-expanded="false"><span></span></button>
    </div>
  </header>

  <main class="auth-page">
    <div class="container auth-grid">
      
      <section class="form-card">
        <h1>Login</h1>
        <p>Access the business owner dashboard.</p>
        <!-- Idhar data-login-form laga diya hy -->
        <form data-login-form>
          <div class="field">
            <label for="email">Email address</label>
            <input class="input" id="email" type="email" placeholder="owner@example.com" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" type="password" placeholder="••••••••" required />
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Continue to Dashboard</button>
            <a class="btn btn-soft" href="signup.html">Create New Account</a>
          </div>
        </form>
      </section>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
